[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sent-trader"
version = "0.2.0"
description = "Pipeline that collects stock prices and news, scores headline sentiment, and stores everything for modeling."
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "feedparser",
    "beautifulsoup4",
    "nltk",
    "yfinance",
    "pandas",
    "requests",
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib",
    "scipy",
    "jupyter",
]

[project.scripts]
sent-trader = "sent_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
